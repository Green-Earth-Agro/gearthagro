<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo/agro_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Staff tooling: keep it out of search results. Real access control is Supabase auth + RLS. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>GreenEarth Agro — Staff Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <!-- Apply the saved theme before paint to avoid a flash; React's useTheme keeps it in sync. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('agro-admin-theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
